services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grigteo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: grigteo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grigteo -d grigteo']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9020:9000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      # Reach the host-bound Ollama (politrack_ollama on 127.0.0.1:11434).
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3021:3001'
    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://grigteo:${POSTGRES_PASSWORD}@db:5432/grigteo
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-grig-teo-media}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-grig-teo-media-private}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_MODEL: ${KIMI_MODEL:-k3}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
      SITE_URL: ${SITE_URL:-}
      DEVICE_API_KEY: ${DEVICE_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b-instruct-q5_K_M}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:8000}
      LEMNISCATE_WEBHOOK_SECRET: ${LEMNISCATE_WEBHOOK_SECRET:-}
      DEV_TELEGRAM_BOT_TOKEN: ${DEV_TELEGRAM_BOT_TOKEN:-}
      DEV_TELEGRAM_CHAT_ID: ${DEV_TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3020:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      API_INTERNAL_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy

  telegram:
    build: ./telegram
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DEVICE_API_KEY: ${DEVICE_API_KEY}
      TELEGRAM_BACKEND_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy

  # CPU speech-to-text for voice/video notes (faster-whisper, model cached
  # in the whisper_models volume). Only the backend talks to it.
  whisper:
    build:
      context: ./backend
      dockerfile: scripts/Dockerfile.whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - whisper_models:/root/.cache/huggingface

  # Local LLM for health-tip generation. Shares politrack_ollama's model
  # store (qwen2.5-14b / qwen3-14b already pulled) — no downloads, no GPU
  # needed, only the backend talks to it over the compose network.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - politrack_ollama_models:/root/.ollama

volumes:
  postgres_data:
  minio_data:
  whisper_models:
  politrack_ollama_models:
    external: true
    name: politrack_politrack_ollama_data
