name: ColmiRingApp
options:
  bundleIdPrefix: space.grig-teo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "99LK64WRBG"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  ColmiRingApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ColmiRingApp
    info:
      path: ColmiRingApp/Info.plist
      properties:
        CFBundleDisplayName: Grig Teo Space
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "The app connects to your COLMI R11 smart ring over Bluetooth to read heart rate, blood oxygen, sleep, and activity data."
        NSBluetoothPeripheralUsageDescription: "The app uses Bluetooth to communicate with your COLMI smart ring."
        NSCameraUsageDescription: "The app uses the camera to scan physical health documents (lab results, prescriptions) and extract their text."
        NSPhotoLibraryUsageDescription: "The app reads your photo library to display your media and back up your photos and videos to your private server."
        NSPhotoLibraryAddUsageDescription: "The app may save media back to your photo library."
        # Background execution: keep the BLE link alive, schedule OS wakeups
        # to flush queued readings, process uploads after relaunch, and back up
        # the photo library periodically.
        UIBackgroundModes:
          - bluetooth-central
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - space.grig-teo.colmi-ring.flush
          - space.grig-teo.colmi-ring.poll
          - space.grig-teo.colmi-ring.media-sync
        # Temporary ATS exception: allows HTTP to the VPS IP until DNS moves
        # to the domain and HTTPS is provisioned. Remove after cutover.
        NSAppTransportSecurity:
          NSExceptionDomains:
            "159.195.139.229":
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.grig-teo.colmi-ring
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
