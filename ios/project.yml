name: ColmiRingApp
options:
  bundleIdPrefix: space.grig-teo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "99LK64WRBG"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  ColmiRingApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ColmiRingApp
    dependencies:
      - target: HealthWidget
        embed: true
    info:
      path: ColmiRingApp/Info.plist
      properties:
        CFBundleDisplayName: Grig Teo Space
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "4"
        UILaunchScreen:
          UIColorName: ""
        # Landscape is declared so the metric detail charts can rotate;
        # AppDelegate + OrientationManager keep the rest of the app portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "The app connects to your COLMI R11 smart ring over Bluetooth to read heart rate, blood oxygen, sleep, and activity data."
        NSBluetoothPeripheralUsageDescription: "The app uses Bluetooth to communicate with your COLMI smart ring."
        NSCameraUsageDescription: "The app uses the camera to scan physical health documents (lab results, prescriptions) and extract their text."
        # Required for the optional app lock: iOS crashes the first Face ID
        # evaluatePolicy call without this string.
        NSFaceIDUsageDescription: "Face ID protects access to your personal health data."
        NSPhotoLibraryUsageDescription: "The app reads your photo library to display your media and back up your photos and videos to your private server."
        NSPhotoLibraryAddUsageDescription: "The app may save media back to your photo library."
        # Background execution: keep the BLE link alive, schedule OS wakeups
        # to flush queued readings, process uploads after relaunch, and back up
        # the photo library periodically.
        UIBackgroundModes:
          - bluetooth-central
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - space.grig-teo.colmi-ring.flush
          - space.grig-teo.colmi-ring.poll
          - space.grig-teo.colmi-ring.media-sync
        # Temporary ATS exception: allows HTTP to the VPS IP until DNS moves
        # to the domain and HTTPS is provisioned. Remove after cutover.
        NSAppTransportSecurity:
          NSExceptionDomains:
            "159.195.139.229":
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Custom URL scheme so the home-screen widget can deep link into the
        # app (grigteo://ring opens the Ring page, grigteo://tips the Tip
        # history page). Registered on the host app; the widget uses
        # Link/widgetURL with this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: space.grig-teo.colmi-ring
            CFBundleURLSchemes:
              - grigteo
        # Backend URL + device key baked in at build time from Shared.xcconfig
        # (gitignored; see Shared.xcconfig.example). Lets the widget extension
        # use the same values without an App Group. URL is reassembled from
        # scheme + host because xcconfig treats `//` as a comment.
        BACKEND_URL: $(APP_BACKEND_SCHEME)://$(APP_BACKEND_HOST)
        DEVICE_API_KEY: $(APP_DEVICE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.grig-teo.colmi-ring
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Shared.xcconfig
      Release: Shared.xcconfig
  ColmiRingAppTests:
    type: bundle.unit-test
    platform: iOS
    # Swift Testing requires the Swift 6.0 runtime tools (iOS 18+). The app
    # target stays at iOS 16; only the test target needs the newer runtime,
    # and tests run on the simulator.
    deploymentTarget: "18.0"
    sources:
      - path: ColmiRingAppTests
    dependencies:
      - target: ColmiRingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.grig-teo.colmi-ring.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  HealthWidget:
    type: app-extension
    platform: iOS
    # iOS 18+ enables interactive widget buttons (Button(intent:) + AppIntent)
    # and symbolEffect(.rotate) for the refresh button. The host app stays at
    # iOS 16; the device runs iOS 26.
    deploymentTarget: "18.0"
    sources:
      - path: Widget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Health Widget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Same ATS exception as the host app — allows HTTP to the VPS IP until
        # DNS/HTTPS is provisioned. Keep in sync with ColmiRingApp's Info.plist.
        NSAppTransportSecurity:
          NSExceptionDomains:
            "159.195.139.229":
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        # Backend URL + device key baked in at build time (same Shared.xcconfig
        # as the host app) so the widget can reach the backend without an App
        # Group. Read via Bundle.main.object(forInfoDictionaryKey:) at runtime.
        BACKEND_URL: $(APP_BACKEND_SCHEME)://$(APP_BACKEND_HOST)
        DEVICE_API_KEY: $(APP_DEVICE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.grig-teo.colmi-ring.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO
    configFiles:
      Debug: Shared.xcconfig
      Release: Shared.xcconfig
schemes:
  ColmiRingApp:
    build:
      targets:
        ColmiRingApp: all
        ColmiRingAppTests: [test]
        HealthWidget: [build]
    test:
      targets:
        - ColmiRingAppTests
