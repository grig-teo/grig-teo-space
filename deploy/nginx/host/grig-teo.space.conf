upstream grig_teo_frontend {
    server 127.0.0.1:3020;
}

upstream grig_teo_backend {
    server 127.0.0.1:3021;
}

server {
    listen 80;
    listen [::]:80;
    server_name grig-teo.space www.grig-teo.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://grig-teo.space$request_uri;
    }
}

# www → apex: consolidate link equity on the canonical host (SEO audit 1.1).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.grig-teo.space;

    ssl_certificate /etc/letsencrypt/live/grig-teo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grig-teo.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://grig-teo.space$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grig-teo.space;

    ssl_certificate /etc/letsencrypt/live/grig-teo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grig-teo.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://grig_teo_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Media uploads can be up to 200 MB (videos). Needs to match the
        # backend's FileInterceptor limit, and allow slow phone uplinks.
        client_max_body_size 200m;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:9020/grig-teo-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://grig_teo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
