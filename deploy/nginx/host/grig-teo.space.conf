upstream grig_teo_frontend {
    server 127.0.0.1:3020;
}

upstream grig_teo_backend {
    server 127.0.0.1:3021;
}

# Per-IP rate limit for the API (10 r/s sustained; short bursts allowed via
# `burst` in the /api/ location). 10 MB zone ≈ 160k client IPs.
limit_req_zone $binary_remote_addr zone=grig_teo_api:10m rate=10r/s;

# Much stricter limit for the admin login endpoint (brute-force protection):
# 1 r/s sustained with a small burst.
limit_req_zone $binary_remote_addr zone=grig_teo_login:10m rate=1r/s;

# Short-TTL page cache. The Next.js frontend renders HTML dynamically and
# marks it no-store, so visitors and crawlers always pay a full server
# render. Caching pages here for 10 minutes cuts TTFB to milliseconds on a
# HIT while keeping content reasonably fresh.
proxy_cache_path /var/cache/nginx/grig-teo-pages levels=1:2 keys_zone=grig_teo_pages:10m max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name grig-teo.space www.grig-teo.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://grig-teo.space$request_uri;
    }
}

# www → apex: consolidate link equity on the canonical host (SEO audit 1.1).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.grig-teo.space;

    ssl_certificate /etc/letsencrypt/live/grig-teo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grig-teo.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://grig-teo.space$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grig-teo.space;

    ssl_certificate /etc/letsencrypt/live/grig-teo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grig-teo.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissive enough for Next.js (inline scripts/styles), still blocks
    # framing and foreign script/connect sources.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # Stricter candidate policy in report-only mode: drops 'unsafe-eval' and
    # the https:/wss: wildcards. Not enforced — evaluate before promoting.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Don't leak the upstream framework banner (Next.js sets X-Powered-By).
    proxy_hide_header X-Powered-By;

    # OpenHands is not deployed on this box. Fail closed explicitly instead of
    # letting the request fall through to the Next.js catch-all (308 -> 404).
    location /OpenHands {
        return 404;
    }

    # Brute-force protection for the admin login: 1 r/s per IP, burst of 5
    # (delayed, not dropped), 503 beyond that. Exact match — must come with
    # its own proxy settings since it shadows `location /api/`.
    location = /api/admin/auth/login {
        limit_req zone=grig_teo_login burst=5;
        limit_req_status 503;

        proxy_pass http://grig_teo_backend/api/admin/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location ^~ /api/ {
        # Per-IP rate limit (zone defined at the top of this file): 10 r/s
        # sustained, up to 20 queued burst requests, 503 beyond that.
        limit_req zone=grig_teo_api burst=20;
        limit_req_status 503;

        proxy_pass http://grig_teo_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Media uploads can be up to 200 MB (videos). Needs to match the
        # backend's FileInterceptor limit, and allow slow phone uplinks.
        client_max_body_size 200m;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # Case variants of the API path (/API, /Api, ...) would otherwise fall
    # through to the Next.js catch-all, whose rewrite proxy 500s on them.
    # The ^~ prefix above keeps lowercase /api/ from ever reaching this regex.
    location ~* ^/api(/|$) {
        return 404;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:9020/grig-teo-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # add_header here disables inheritance of the server-level security
        # headers; nosniff matters most for user-uploaded files.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://grig_teo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Page microcache (see proxy_cache_path above). Requests carrying
        # cookies bypass the cache so personalized responses are never
        # stored. The app's no-store header is overridden for cacheable
        # pages; X-Page-Cache exposes HIT/MISS for debugging.
        proxy_cache grig_teo_pages;
        proxy_cache_key $scheme$host$request_uri$http_accept_encoding;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_no_cache $http_cookie;
        proxy_cache_bypass $http_cookie;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_hide_header Cache-Control;
        # NOTE: any add_header in a location disables inheritance of the
        # server-level security headers, so they are repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Page-Cache $upstream_cache_status always;
    }
}
